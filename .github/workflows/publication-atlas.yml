name: Publication-grade real-data atlas
on:
  push:
    branches: [main]
    paths:
      - 'scripts/publication_atlas.py'
      - 'scripts/source_inventory.py'
      - 'tests/test_publication_atlas.py'
      - '.github/workflows/publication-atlas.yml'
  workflow_dispatch:
concurrency:
  group: publication-atlas-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  reproduce-public-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis and test dependencies
        run: python -m pip install -e '.[analysis,test]'
      - name: Download and SHA256-verify official public demo datasets
        run: python scripts/fetch_demo.py --dataset both
      - name: Run publication-figure tests against real data
        run: PYTHONPATH=.:src pytest -q tests/test_publication_atlas.py
      - name: Generate aggregate-only reproducible atlas and QA report
        run: python scripts/publication_atlas.py
      - name: Audit all 37 real source tables and plot schema fingerprint
        run: python scripts/source_inventory.py
      - name: Audit publication artifact contracts
        shell: bash
        run: |
          test "$(find evidence/publication_atlas/figures -name '*.png' | wc -l)" -eq 7
          test "$(find evidence/publication_atlas/figures -name '*.svg' | wc -l)" -eq 7
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('evidence/publication_atlas/aggregate_results.json').read_text())
          import json
          schema=json.loads(Path('evidence/publication_atlas/all_source_schema_inventory.json').read_text())
          assert schema['n_csv_tables']==37
          assert x['n_ed_stays']==222
          assert len(x['evaluation_applicability'])==16
          assert all(y['value'] is None for y in x['evaluation_applicability'])
          assert x['matched_ed_window']=={'labevents':1833,'emar':595}
          PY
      - name: Retire basic v0.2 plots after new atlas passes all gates
        run: |
          git rm -r --ignore-unmatch evidence/figures
          git rm --ignore-unmatch evidence/verified_demo_dashboard.html
      - name: Commit verified atlas; preserve concurrent main changes without force push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          snapshot="$(mktemp -d)"
          cp -a evidence/publication_atlas "$snapshot/atlas"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! cmp -s scripts/publication_atlas.py <(git show origin/main:scripts/publication_atlas.py); then
              echo "Superseded by newer atlas source; no stale evidence will be published."
              exit 0
            fi
            if ! cmp -s scripts/source_inventory.py <(git show origin/main:scripts/source_inventory.py); then
              echo "Superseded by newer inventory source; no stale evidence will be published."
              exit 0
            fi
            git reset --hard origin/main
            rm -rf evidence/publication_atlas
            cp -a "$snapshot/atlas" evidence/publication_atlas
            git rm -r --ignore-unmatch evidence/figures
            git rm --ignore-unmatch evidence/verified_demo_dashboard.html
            git add -A -- evidence/publication_atlas
            if git diff --cached --quiet; then
              echo "Already published."
              exit 0
            fi
            git commit -m "Publish independently verified public-demo observation atlas"
            if git push origin HEAD:main; then exit 0; fi
            echo "Non-fast-forward; retrying publication with newest main."
          done
          echo "Could not publish after three safe retries."
          exit 1
