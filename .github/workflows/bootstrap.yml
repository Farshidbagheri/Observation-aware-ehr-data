name: Expand verified research source bundle
on:
  push:
    branches: [main]
    paths:
      - '_bootstrap/**'
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source bundle integrity
        shell: bash
        run: |
          echo "08dd661719f5e277853ff7350281a2695df2ee4080f9b4b4a488bcd0c1653f9b  _bootstrap/source_bundle.zip" | sha256sum --check -
      - name: Expand vetted source tree
        shell: bash
        run: |
          unzip -q -o _bootstrap/source_bundle.zip -d .
          test -f src/obs_ehr/core.py
          test -f tests/test_core.py
          test -f evidence/real_mimic_demo_profile_v0.2.json
          test -f evidence/verified_demo_dashboard.html
      - name: Commit versioned research implementation (no workflow scope required)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- README.md .gitignore compose.yaml pyproject.toml docs scripts src tests evidence data/README.md
          if git diff --cached --quiet; then
            echo "Source tree already committed."
            exit 0
          fi
          git commit -m "Expand verified public-demo EHR research source v0.2"
          git push origin HEAD:main
