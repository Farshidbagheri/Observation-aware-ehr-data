name: Publish real public-demo descriptive figures
on:
  push:
    branches: [main]
    paths:
      - '_bootstrap/figures_bundle.zip'
permissions:
  contents: write
jobs:
  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify PNG/SVG research bundle
        run: |
          echo "a33e422b3a9013fbcc74fed5eab4ad5d99b1fd5a673ed6a435fafb0d2c4dd572  _bootstrap/figures_bundle.zip" | sha256sum --check -
      - name: Extract charts to documented evidence location
        run: |
          unzip -q -o _bootstrap/figures_bundle.zip -d .
          test "$(find evidence/figures -maxdepth 1 -name '*.png' | wc -l)" -eq 12
          test "$(find evidence/figures -maxdepth 1 -name '*.svg' | wc -l)" -eq 12
      - name: Commit aggregate-only chart assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- evidence/figures/
          git diff --cached --quiet && exit 0
          git commit -m "Add 12 audited MIMIC public-demo visualizations in PNG and SVG"
          git push origin HEAD:main
