[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "observation-aware-ehr-data"
version = "0.3.0"
description = "Observation-aware clinical event histories, reproducible data audits and as-of retrieval evaluation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mongo = ["pymongo>=4.6,<6"]
test = ["pytest>=7"]
analysis = ["matplotlib>=3.8"]

[project.scripts]
obs-ehr = "obs_ehr.cli:main"

[tool.setuptools.packages.find]
where=["src"]

